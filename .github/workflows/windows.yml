name: Patched SFW for Windows

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published sing-box tag. Blank follows both stable and preview SFW x64 releases.'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: sfw-windows-x64-releases
  cancel-in-progress: false

jobs:
  windows:
    name: SFW (${{ matrix.channel }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.tag && '["manual"]' || '["stable", "preview"]') }}
    uses: ./.github/workflows/windows-release.yml
    with:
      tag: ${{ inputs.tag }}
      channel: ${{ matrix.channel }}
    secrets:
      WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
